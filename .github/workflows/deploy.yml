name: Deploy to Production

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run linter
        run: npm run lint --if-present
      
      - name: Run tests
        run: npm test --if-present
      
      - name: Build application
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ secrets.BACKEND_URL }}
          VITE_GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      
      - name: Verify build artifacts
        run: |
          if [ ! -d "dist" ]; then
            echo "Build failed: dist directory not found"
            exit 1
          fi
          echo "Build successful!"
          ls -la dist/
      
      - name: Smoke test - Verify all simulations load
        run: |
          echo "Running smoke tests on built application..."
          # Check for critical simulation files
          for sim in ProjectileSim TitrationSim CircuitSim DnaSim; do
            if grep -q "$sim" dist/**/*.js 2>/dev/null || grep -q "$sim" src/simulations/*.jsx 2>/dev/null; then
              echo "✅ $sim found"
            else
              echo "⚠️ $sim not found (may be bundled)"
            fi
          done
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
        
      - name: Deploy preview
        uses: amondnet/vercel-action@v25
        if: github.event_name == 'pull_request'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--preview'
          working-directory: ./
      
      - name: Notify deployment status
        if: always()
        run: |
          echo "::notice::Deployment completed with status: ${{ job.status }}"
